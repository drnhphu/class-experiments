<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Class experiments</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.5"></script>
</head>
<body class="bg-slate-50 text-slate-900 antialiased">
  <!-- Student page (phone, 360 px): join, consent, self-paced opening batch, games, quiz, personal results. -->
  <main class="mx-auto max-w-sm p-4 space-y-4">
    <header class="flex items-center justify-between">
      <h1 id="title" class="text-lg font-semibold"></h1>
      <span id="sync" class="text-xs text-slate-400"></span>
    </header>
    <p id="status" class="text-sm text-slate-600"></p>
    <section id="view" class="space-y-4"></section>
    <p id="who" class="pt-6 text-xs text-slate-400"></p>
  </main>

  <script type="module">
    import {
      auth, db, configMissing, signInAnonymously, onAuthStateChanged,
      doc, getDoc, setDoc, updateDoc, onSnapshot, serverTimestamp, waitForPendingWrites
    } from "./js/firebase.js";
    import { loadLang, makeT, pick, el } from "./js/i18n.js";
    import { loadCatalog, loadConfig, loadEngine, loadQuiz } from "./js/catalog.js";
    import { ROOM_RE, normalizeRoomCode, responseId } from "./js/room.js";
    import { parseStepKey, localStore, QUIZ_ID } from "./js/session.js";

    const $ = (id) => document.getElementById(id);
    const S = { lang: "vi", t: makeT({}), code: null, uid: null, session: null, catalog: null, catalogName: null,
                store: null, viewKey: null, joinState: "unknown", busy: false };

    async function setLang(lang) {
      S.lang = lang === "en" ? "en" : "vi";
      S.t = makeT(await loadLang(S.lang));
      document.documentElement.lang = S.lang;
      $("title").textContent = S.t("app.title");
    }

    function setStatus(text, tone = "muted") {
      const tones = { muted: "text-slate-600", ok: "text-emerald-700", bad: "text-rose-700" };
      $("status").className = `text-sm ${tones[tone]}`;
      $("status").textContent = text || "";
    }

    function show(key, build) {
      if (S.viewKey === key) return;
      S.viewKey = key;
      (S.viewUnsubs || []).forEach((u) => u()); // listeners of the previous screen (games)
      S.viewUnsubs = [];
      if (!key.startsWith("collect:")) S.watchKey = null;
      const node = build();
      $("view").replaceChildren(...(node ? [node] : []));
    }

    // ---------- writes (queued offline by Firestore; we do not block the next screen on the server ack) ----------
    function trackWrite(promise) {
      $("sync").textContent = S.t("sync.pending");
      promise.catch((e) => {
        setStatus(e.code === "permission-denied" ? S.t("err.writeClosed") : `${S.t("err.write")} (${e.code || e.message})`, "bad");
      });
      waitForPendingWrites(db).then(() => { $("sync").textContent = S.t("sync.done"); }).catch(() => {});
    }

    function writeResponse(exp, answers, times) {
      const payload = { uid: S.uid, exp, answers, updatedAt: serverTimestamp() };
      if (times) payload.times = times;
      if (S.session?.consent) payload.consent = S.store.get().consent ?? null;
      const write = setDoc(doc(db, "sessions", S.code, "responses", responseId(S.uid, exp)), payload, { merge: true });
      trackWrite(write);
      S.store.update((st) => {
        st.answers = st.answers || {};
        st.answers[exp] = { ...(st.answers[exp] || {}), ...answers };
        if (times) { st.times = st.times || {}; st.times[exp] = { ...(st.times[exp] || {}), ...times }; }
        return st;
      });
      return write;
    }

    function updateParticipant(fields) {
      trackWrite(updateDoc(doc(db, "sessions", S.code, "participants", S.uid), fields));
    }

    // ---------- boot ----------
    await setLang(new URLSearchParams(location.search).get("lang") || "vi");
    if (configMissing) { setStatus(S.t("err.config"), "bad"); throw new Error("config"); }
    setStatus(S.t("status.connecting"));

    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        try { await signInAnonymously(auth); } catch (e) { setStatus(`${S.t("err.signin")} (${e.code})`, "bad"); }
        return;
      }
      if (S.uid) return;
      S.uid = user.uid;
      $("who").textContent = `${S.t("who.id")}: ${user.uid.slice(0, 6)}…`;
      const fromUrl = normalizeRoomCode(new URLSearchParams(location.search).get("room"));
      if (ROOM_RE.test(fromUrl)) enterRoom(fromUrl); else showEnter();
    });

    function showEnter(prefill = "") {
      setStatus("");
      show("enter", () => {
        const input = el("input", { maxlength: "6", autocomplete: "off", autocapitalize: "characters", value: prefill,
          class: "w-full rounded-lg border border-slate-300 px-3 py-3 text-center text-2xl tracking-widest uppercase", placeholder: "ABC234" });
        const btn = el("button", { class: "w-full rounded-lg bg-slate-900 py-3 font-medium text-white",
          onclick: () => enterRoom(normalizeRoomCode(input.value)) }, S.t("join.button"));
        return el("div", { class: "space-y-2" }, el("label", { class: "block text-sm font-medium" }, S.t("join.code")), input, btn);
      });
    }

    async function enterRoom(code) {
      if (!ROOM_RE.test(code)) { setStatus(S.t("join.badCode"), "bad"); return; }
      try {
        const snap = await getDoc(doc(db, "sessions", code));
        if (!snap.exists()) { S.viewKey = null; showEnter(code); setStatus(S.t("join.notFound"), "bad"); return; }
      } catch (e) { setStatus(`${S.t("join.error")} (${e.code || e.message})`, "bad"); return; }
      S.code = code;
      S.store = localStore(code, S.uid);
      markVisible(); // the page was closed or reloaded while a watched step was open
      history.replaceState(null, "", `?room=${code}`);
      onSnapshot(doc(db, "sessions", code), onSession, (e) => setStatus(`${S.t("join.error")} (${e.code})`, "bad"));
    }

    async function onSession(snap) {
      const s = snap.data();
      if (!s) return;
      const langChanged = s.lang !== S.lang;
      S.session = s;
      if (langChanged) { await setLang(s.lang); S.viewKey = null; $("who").textContent = `${S.t("who.id")}: ${S.uid.slice(0, 6)}…`; }
      if (S.catalogName !== s.catalog) { S.catalog = await loadCatalog(s.catalog || "main"); S.catalogName = s.catalog; }
      await ensureJoined();
      route();
    }

    // Create the participant record once. Offline: the write is queued, so we continue optimistically.
    async function ensureJoined() {
      const st = S.store.get();
      if (st.joined) { S.joinState = "joined"; return; }
      if (S.joinState === "pending" || S.joinState === "refused") return;
      if (S.session.locked) return;
      S.joinState = "pending";
      const write = setDoc(doc(db, "sessions", S.code, "participants", S.uid), { joinedAt: serverTimestamp(), lang: S.session.lang });
      const outcome = await Promise.race([write.then(() => "ok", (e) => e.code), new Promise((r) => setTimeout(() => r("timeout"), 8000))]);
      // A refused create while the room still accepts people means the record already exists
      // (same anonymous user, local storage cleared): treat as joined.
      const alreadyThere = outcome === "permission-denied" && S.session.joinOpen && !S.session.locked;
      if (outcome === "ok" || outcome === "timeout" || alreadyThere) {
        S.store.update((x) => { x.joined = true; return x; });
        S.joinState = "joined";
      } else {
        S.joinState = "refused";
      }
    }

    // ---------- routing ----------
    function route() {
      const s = S.session;
      const st = S.store.get();
      setStatus("");
      if (s.locked) return show("ended", () => el("p", { class: "text-lg" }, S.t("join.ended")));
      if (S.joinState === "refused") return show("refused", () => el("p", { class: "text-lg" }, S.t("join.closed")));
      if (S.joinState !== "joined") return show("joining", () => el("p", {}, S.t("status.connecting")));
      if (s.consent && st.consent == null) return showConsent();
      if (s.game) return showGame(s.game);
      if (s.quiz && (s.quiz.open || s.quiz.reveal)) return showQuiz(s.quiz);
      const remaining = remainingSteps();
      if (s.collectOpen && remaining.length) return showStep(remaining[0], remaining.length);
      if (s.reveal && st.answers?.[s.reveal]) return showPersonalResult(s.reveal);
      const finished = (s.order || []).length && !remaining.length;
      return show(finished ? "done" : "wait", () => el("p", { class: "text-lg" }, S.t(finished ? "collect.done" : "wait.general")));
    }

    function remainingSteps() {
      const s = S.session, done = S.store.get().done || {};
      const closed = s.revealed || []; // once its results are shown, an experiment no longer takes answers
      return (s.order || []).filter((k) => { const e = parseStepKey(k).exp; return !done[k] && (s.collect || []).includes(e) && !closed.includes(e); });
    }

    function showConsent() {
      show("consent", () => {
        const answer = (val) => {
          S.store.update((st) => { st.consent = val; return st; });
          updateParticipant({ consent: val });
          S.viewKey = null; route();
        };
        return el("div", { class: "space-y-4 rounded-xl bg-white p-4 shadow-sm" },
          el("h2", { class: "text-lg font-semibold" }, S.t("consent.title")),
          el("p", { class: "whitespace-pre-line text-sm" }, S.t("consent.body")),
          el("div", { class: "grid gap-2" },
            el("button", { class: "rounded-lg bg-slate-900 py-3 font-medium text-white", onclick: () => answer(true) }, S.t("consent.agree")),
            el("button", { class: "rounded-lg border border-slate-300 py-3", onclick: () => answer(false) }, S.t("consent.decline"))));
      });
    }

    function makeCtx(exp, extra = {}) {
      const st = S.store.get();
      return { lang: S.lang, t: S.t, uid: S.uid, code: S.code, exp, myAnswers: st.answers?.[exp] || {}, myTimes: st.times?.[exp] || {}, ...extra };
    }

    async function assignmentFor(exp, fresh = false) {
      S.assignCache = S.assignCache || {};
      if (fresh || !(exp in S.assignCache)) {
        const snap = await getDoc(doc(db, "sessions", S.code, "assignments", exp)).catch(() => null);
        S.assignCache[exp] = snap?.exists() ? snap.data() : null;
      }
      const a = S.assignCache[exp];
      return a?.byUid ? (a.byUid[S.uid] ?? null) : a;
    }

    // ---------- opening batch, self-paced ----------
    function showStep(key, remainingCount) {
      const total = (S.session.order || []).filter((k) => (S.session.collect || []).includes(parseStepKey(k).exp)).length;
      show(`collect:${key}`, () => {
        const box = el("div", { class: "space-y-3" },
          el("p", { class: "text-xs text-slate-500" }, S.t("collect.progress", { i: total - remainingCount + 1, n: total })),
          el("p", { class: "text-sm text-slate-500" }, S.t("status.loading")));
        renderStep(key, box);
        return box;
      });
    }

    async function renderStep(key, box) {
      const { exp, step } = parseStepKey(key);
      try {
        const config = await loadConfig(S.catalog, exp);
        const engine = await loadEngine(S.catalog, config.engine);
        let assignment = await assignmentFor(exp);
        // Between-subject experiments (config.conditions): wait until the instructor's page has given
        // this phone its condition, then draw the step.
        if (Array.isArray(config.conditions) && assignment == null) {
          if (S.viewKey !== `collect:${key}`) return;
          box.lastChild.replaceWith(el("p", { class: "text-sm text-slate-500" }, S.t("collect.waitGroup")));
          const unsub = onSnapshot(doc(db, "sessions", S.code, "assignments", exp), (snap) => {
            const a = snap.data();
            if (S.viewKey !== `collect:${key}`) { unsub(); return; }
            if (a?.byUid?.[S.uid] == null) return;
            unsub();
            S.assignCache[exp] = a;
            renderStep(key, box);
          });
          return;
        }
        // First time this step appeared on this phone (kept across reloads): timers and response
        // times count from here, so leaving or reloading does not restart the clock.
        let startedAt = S.store.get().opened?.[key];
        if (!startedAt) { startedAt = Date.now(); S.store.update((st) => { st.opened = { ...(st.opened || {}), [key]: startedAt }; return st; }); }
        const watched = !!config.noLookup;
        S.watchKey = watched ? key : null;
        const ctx = makeCtx(exp, { step, assignment, startedAt, submit: (answers, times) => {
          if (S.busy || S.viewKey !== `collect:${key}`) return;
          S.busy = true;
          if (watched) {
            const a = S.store.get().away?.[key] || { ms: 0, n: 0 };
            times = { ...(times || {}), [`away:${step}`]: a.ms, [`leaves:${step}`]: a.n };
          }
          S.watchKey = null;
          writeResponse(exp, answers, times);
          S.store.update((st) => { st.done = { ...(st.done || {}), [key]: true }; return st; });
          if (!remainingSteps().length) updateParticipant({ done: true });
          S.busy = false;
          S.viewKey = null;
          route();
        } });
        const node = engine.renderStudent(step, config, ctx);
        if (S.viewKey !== `collect:${key}`) return;
        const parts = [];
        if (watched) {
          parts.push(el("p", { class: "rounded-lg border border-amber-300 bg-amber-50 p-3 text-sm text-amber-900" }, S.t("away.warn")));
          S.awayNote = el("p", { class: "hidden rounded-lg bg-amber-100 p-3 text-sm font-medium text-amber-900" });
          parts.push(S.awayNote);
          const a = S.store.get().away?.[key];
          if (a?.n) showAwayNote(a);
        }
        parts.push(el("div", { class: "rounded-xl bg-white p-4 shadow-sm" }, node));
        box.lastChild.replaceWith(el("div", { class: "space-y-3" }, ...parts));
      } catch (e) {
        box.lastChild.replaceWith(el("p", { class: "text-rose-700" }, `${S.t("err.load")} (${e.message})`));
      }
    }

    // ---------- leaving the screen during a step with a correct answer (config.noLookup) ----------
    // Hidden page or closed tab: remember when. Back on the page (or reloaded): add the time away and
    // one more leave to this step's record; the totals go into the response when the step is sent.
    function markHidden() {
      if (!S.store || !S.watchKey) return;
      const key = S.watchKey;
      S.store.update((st) => { if (!st.hiddenAt) st.hiddenAt = { key, at: Date.now() }; return st; });
    }
    function markVisible() {
      if (!S.store) return;
      let back = null;
      S.store.update((st) => {
        const h = st.hiddenAt;
        if (!h) return st;
        delete st.hiddenAt;
        if (st.done?.[h.key]) return st;
        const cur = st.away?.[h.key] || { ms: 0, n: 0 };
        const next = { ms: cur.ms + Math.max(0, Date.now() - h.at), n: cur.n + 1 };
        st.away = { ...(st.away || {}), [h.key]: next };
        back = { key: h.key, ...next };
        return st;
      });
      if (back && back.key === S.watchKey) showAwayNote(back);
    }
    function showAwayNote(a) {
      if (!S.awayNote) return;
      S.awayNote.textContent = S.t("away.back", { n: a.n, s: Math.round(a.ms / 1000) });
      S.awayNote.classList.remove("hidden");
    }
    document.addEventListener("visibilitychange", () => (document.visibilityState === "hidden" ? markHidden() : markVisible()));
    window.addEventListener("pagehide", markHidden);

    // ---------- personal result after reveal (engine C computes it on the phone) ----------
    function showPersonalResult(exp) {
      show(`result:${exp}`, () => {
        const box = el("div", {}, el("p", { class: "text-sm text-slate-500" }, S.t("status.loading")));
        (async () => {
          const config = await loadConfig(S.catalog, exp);
          const engine = await loadEngine(S.catalog, config.engine);
          const mine = S.store.get().answers?.[exp] || {};
          const score = engine.scoreLocal(mine, config);
          // Between-subject experiments show which version this phone got, so pass its condition.
          const assignment = Array.isArray(config.conditions) ? await assignmentFor(exp, true) : null;
          const node = score == null ? null : engine.renderStudent("__result", config, makeCtx(exp, { score, assignment }));
          box.replaceChildren(node || el("p", { class: "text-lg" }, S.t("reveal.look")));
        })().catch((e) => box.replaceChildren(el("p", { class: "text-rose-700" }, `${S.t("err.load")} (${e.message})`)));
        return box;
      });
    }

    // ---------- games: intro, open, locked, reveal ----------
    const card = (node) => el("div", { class: "rounded-xl bg-white p-4 shadow-sm" }, node);

    // Listen to one document while the screen `key` is showing; show() stops it when the screen changes.
    // A listener recovers by itself after a network gap and replaces a cached copy with the server's.
    function watchDoc(ref, key, onData) {
      if (S.viewKey !== key) return; // the screen changed while its engine was loading
      const unsub = onSnapshot(ref, (snap) => { if (S.viewKey === key) onData(snap.data()); },
        () => {}); // a refused or failed listen leaves the "loading" text; the next phase draws a new screen
      (S.viewUnsubs ||= []).push(unsub);
    }

    function showGame(g) {
      const rk = `r${g.round || 1}`;
      const answered = S.store.get().answers?.[g.exp]?.[rk] != null;
      const key = `game:${g.exp}:${g.phase}:${rk}:${answered}`;
      show(key, () => {
        const box = el("div", { class: "space-y-3" }, el("p", { class: "text-sm text-slate-500" }, S.t("status.loading")));
        (async () => {
          const config = await loadConfig(S.catalog, g.exp);
          const engine = await loadEngine(S.catalog, config.engine);
          const head = el("p", { class: "text-xs text-slate-500" }, S.t("game.round", { r: g.round || 1 }));
          let body;
          if (g.phase === "intro") {
            // The engine may draw the rules itself (engine D: payoff table, notice about the machine).
            const intro = engine.renderStudent("__intro", config, makeCtx(g.exp, { round: g.round || 1 }))
              || el("p", { class: "whitespace-pre-line" }, pick(config.rules || config.scenario, S.lang));
            body = el("div", { class: "space-y-3" }, intro, el("p", { class: "text-sm text-slate-500" }, S.t("game.waitOpen")));
          } else if (g.phase === "open") {
            if (answered) body = el("p", { class: "text-lg" }, S.t("game.waitOthers"));
            else {
              // Seats come through a listener, not one read: a failed read, or a stale copy from the
              // phone's offline cache, cannot leave a seated person on the "no pair yet" screen; the
              // screen is drawn again only if the seat itself changes.
              let drawn;
              watchDoc(doc(db, "sessions", S.code, "assignments", g.exp), key, (a) => {
                (S.assignCache ||= {})[g.exp] = a ?? null;
                const assignment = a?.byUid ? (a.byUid[S.uid] ?? null) : (a ?? null);
                if (drawn !== undefined && assignment === drawn) return;
                drawn = assignment;
                box.replaceChildren(head, card(engine.renderStudent(rk, config, makeCtx(g.exp, { step: rk, round: g.round || 1, assignment,
                  submit: (answers, times) => {
                    if (S.store.get().answers?.[g.exp]?.[rk] != null) return;
                    // A choice the server refuses (the instructor went back a phase just as it was sent)
                    // is taken back on the phone too, so the choice screen comes again when the round reopens.
                    writeResponse(g.exp, answers, times).catch((e) => {
                      if (e.code !== "permission-denied") return;
                      S.store.update((st) => { for (const k of Object.keys(answers)) delete st.answers?.[g.exp]?.[k]; return st; });
                      S.viewKey = null; route();
                    });
                    S.viewKey = null; route();
                  } }))));
              });
              return;
            }
          } else if (g.phase === "locked") {
            body = el("p", { class: "text-lg" }, S.t("game.locked"));
          } else {
            // Seat and results through listeners too: the screen is drawn once both are there, and drawn
            // again if either changes; a copy of an earlier round (offline cache) waits for this round's.
            let a, r;
            const draw = () => {
              if (a === undefined || !r || (r.round ?? 1) !== (g.round || 1)) return;
              const assignment = a?.byUid ? (a.byUid[S.uid] ?? null) : a;
              box.replaceChildren(head, card(engine.renderStudent("__result", config, makeCtx(g.exp, { round: g.round || 1, result: r.result || null,
                assignment })) || el("p", {}, S.t("reveal.look"))));
            };
            watchDoc(doc(db, "sessions", S.code, "assignments", g.exp), key, (x) => { a = x ?? null; draw(); });
            watchDoc(doc(db, "sessions", S.code, "results", g.exp), key, (x) => { r = x; draw(); });
            return;
          }
          box.replaceChildren(head, card(body));
        })().catch((e) => box.replaceChildren(el("p", { class: "text-rose-700" }, `${S.t("err.load")} (${e.message})`)));
        return box;
      });
    }

    // ---------- end-of-session quiz ----------
    function showQuiz(q) {
      const mine = S.store.get().answers?.[QUIZ_ID];
      const mode = q.reveal ? "reveal" : (mine ? "sent" : "open");
      show(`quiz:${q.id}:${mode}`, () => {
        const box = el("div", { class: "space-y-3" }, el("p", { class: "text-sm text-slate-500" }, S.t("status.loading")));
        loadQuiz(S.catalog, q.id).then((quiz) => {
          if (mode === "sent") return box.replaceChildren(el("p", { class: "text-lg" }, S.t("quiz.sent")));
          const items = quiz.questions.map((qq, i) => {
            const name = `q${i + 1}`;
            const opts = qq.options.map((o, j) => {
              const mark = mode === "reveal" ? (j === qq.answer ? " ✓" : (mine?.[name] === j ? " ✗" : "")) : "";
              return el("label", { class: "flex items-center gap-2 rounded-lg border border-slate-200 px-3 py-2" },
                el("input", { type: "radio", name, value: String(j), disabled: mode === "reveal", checked: mine?.[name] === j }),
                el("span", {}, pick(o, S.lang) + mark));
            });
            return el("fieldset", { class: "space-y-2" }, el("legend", { class: "font-medium" }, `${i + 1}. ${pick(qq.prompt, S.lang)}`), opts);
          });
          const parts = [el("h2", { class: "text-lg font-semibold" }, pick(quiz.title, S.lang)), ...items];
          if (mode === "open") {
            let area = null;
            if (quiz.reflection) {
              area = el("textarea", { maxlength: "500", rows: "3", class: "w-full rounded-lg border border-slate-300 p-2" });
              parts.push(el("label", { class: "block space-y-1" }, el("span", { class: "font-medium" }, pick(quiz.reflection, S.lang)), area));
            }
            parts.push(el("button", { class: "w-full rounded-lg bg-slate-900 py-3 font-medium text-white", onclick: () => {
              const answers = {};
              quiz.questions.forEach((_, i) => {
                const c = box.querySelector(`input[name=q${i + 1}]:checked`);
                if (c) answers[`q${i + 1}`] = Number(c.value);
              });
              if (area && area.value.trim()) answers.reflection = area.value.trim().slice(0, 500);
              writeResponse(QUIZ_ID, answers, null);
              S.viewKey = null; route();
            } }, S.t("quiz.submit")));
          }
          box.replaceChildren(el("div", { class: "space-y-4 rounded-xl bg-white p-4 shadow-sm" }, parts));
        }).catch((e) => box.replaceChildren(el("p", { class: "text-rose-700" }, `${S.t("err.load")} (${e.message})`)));
        return box;
      });
    }
  </script>
</body>
</html>
